<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychologische Grundlagen Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --success-bg: #e6f4ea;
            --success-text: #137333;
            --error-bg: #fce8e6;
            --error-text: #c5221f;
            --border-color: #dadce0;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        
        #app {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        
        .view {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .view.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 6px rgba(60,64,67,0.15);
            margin-bottom: 24px;
        }
        
        h1, h2 {
            margin-top: 0;
            color: var(--text-main);
            font-weight: 500;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }
        
        .stat-box {
            background: #f1f3f4;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px;
        }
        
        .btn:hover {
            background-color: var(--primary-hover);
        }
        
        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }
        
        .btn-outline:hover {
            background-color: #f1f3f4;
        }
        
        .btn-danger {
            color: var(--error-text);
            background-color: transparent;
        }
        .btn-danger:hover {
            background-color: var(--error-bg);
        }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e8eaed;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        
        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 500;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        
        .option:hover:not(.disabled) {
            background-color: #f8f9fa;
        }
        
        .option.selected {
            border-color: var(--primary-color);
            background-color: #e8f0fe;
        }
        
        .option.correct {
            border-color: var(--success-text);
            background-color: var(--success-bg);
            color: var(--success-text);
        }
        
        .option.incorrect {
            border-color: var(--error-text);
            background-color: var(--error-bg);
            color: var(--error-text);
        }
        
        .option.disabled {
            cursor: default;
        }
        
        .option-icon {
            margin-right: 12px;
            font-family: 'Material Icons';
            font-size: 24px;
        }
        
        .action-buttons {
            margin-top: 32px;
            display: flex;
            justify-content: space-between;
        }
        
        .feedback {
            margin-top: 16px;
            font-weight: 500;
            font-size: 16px;
            display: none;
            padding: 12px;
            border-radius: 8px;
        }
        .feedback.success {
            background-color: var(--success-bg);
            color: var(--success-text);
            display: block;
        }
        .feedback.error {
            background-color: var(--error-bg);
            color: var(--error-text);
            display: block;
        }

        .result-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 24px;
        }

        .flex-center {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Start Menu -->
        <div id="view-start" class="view active">
            <div class="card" style="text-align: center;">
                <h1>Psychologie Quiz</h1>
                <p style="color: var(--text-secondary);">Grundlagen des Lernens & Lehrens (61 Fragen)</p>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="stat-tests">0</div>
                        <div class="stat-label">Absolvierte Tests</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="stat-correct">0</div>
                        <div class="stat-label">Fragen Richtig</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="stat-wrong">0</div>
                        <div class="stat-label">Fragen Falsch</div>
                    </div>
                </div>

                <div class="flex-center">
                    <button class="btn" onclick="startQuiz('chrono')">
                        <span class="material-icons">play_arrow</span> Chronologisch (1-61)
                    </button>
                    <button class="btn btn-outline" onclick="startQuiz('random')">
                        <span class="material-icons">shuffle</span> Zufällige Reihenfolge
                    </button>
                </div>
                <div style="margin-top: 16px;">
                    <button class="btn btn-outline btn-danger" onclick="resetStats()" style="font-size: 14px; padding: 8px 16px;">
                        Statistiken zurücksetzen
                    </button>
                </div>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="view-quiz" class="view">
            <div class="card">
                <div class="quiz-header">
                    <span id="quiz-progress-text" style="font-weight: 500; color: var(--text-secondary);">Frage 1 von 61</span>
                    <button class="btn btn-outline btn-danger" onclick="abortQuiz()" style="padding: 6px 12px; margin:0;">
                        <span class="material-icons" style="font-size: 18px;">close</span> Abbrechen
                    </button>
                </div>
                <div class="progress-bar-container">
                    <div id="quiz-progress-bar" class="progress-bar"></div>
                </div>
                
                <div id="question-container">
                    <div id="question-text" class="question-text"></div>
                    <div id="options-container" class="options-list"></div>
                </div>
                
                <div id="feedback-msg" class="feedback"></div>

                <div class="action-buttons">
                    <div></div>
                    <button id="btn-check" class="btn" onclick="checkAnswer()">Überprüfen</button>
                    <button id="btn-next" class="btn" onclick="nextQuestion()" style="display: none;">
                        Nächste Frage <span class="material-icons">arrow_forward</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- End View -->
        <div id="view-end" class="view">
            <div class="card" style="text-align: center;">
                <h2>Quiz Beendet!</h2>
                <div id="result-circle" class="result-circle">0/0</div>
                <p id="result-text" style="font-size: 18px; margin-bottom: 32px;"></p>
                
                <div class="flex-center">
                    <button class="btn btn-outline" onclick="showStartMenu()">
                        <span class="material-icons">home</span> Zurück zum Menü
                    </button>
                    <button id="btn-retry" class="btn" onclick="startQuiz('retry')" style="display: none;">
                        <span class="material-icons">replay</span> Falsche wiederholen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = [
            { id: 1, text: "Welche Phänomene beschreiben sogenannte Genom-Umwelt-Korrelationen?", options: [
                { text: "Individuen erhalten neben ihren genetischen Anlagen auch die dazu passende Umwelt von ihren Eltern.", isCorrect: true },

                { text: "Der Einfluss der Umweltbedingungen ist vom Genom abhängig.", isCorrect: false },
                { text: "Individuen wählen, schaffen oder verändern Umwelten, die zu ihrer genetischen Ausstattung passen.", isCorrect: true },

                { text: "Wie motiviert er bzw. sie ist.", isCorrect: true },

                { text: "Das Absterben von Synapsen.", isCorrect: false },

            { id: 8, text: "Welche der folgenden Entwicklungstheorien gehen NICHT von einer aktiven Rolle der Umwelt für die Entwicklung von Menschen aus?", options: [

            { id: 10, text: "Welche Aussagen über Entwicklungsaufgaben sind FALSCH?", options: [

                { text: "Emotionen beeinflussen den Abruf von Informationen aus dem Langzeitgedächtnis.", isCorrect: true },
                { text: "Negative Emotionen haben immer negative Konsequenzen für den Wissenserwerb.", isCorrect: false }
            ]},
            { id: 17, text: "Welche Verhaltensweisen einer Lehrkraft eigenen sich um im Unterricht eine symmetrische Kommunikation mit den Schüler:Innen zu erreichen?", options: [

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz(mode) {
            if (mode === 'chrono') {
                currentSet = [...allQuestions];
            } else if (mode === 'random') {
                currentSet = shuffleArray(allQuestions);
            } else if (mode === 'retry') {
                currentSet = [...incorrectQuestions];
            }
            
            currentIndex = 0;
            score = 0;
            incorrectQuestions = [];
            
            if (currentSet.length === 0) {
                alert("Keine Fragen vorhanden!");
                return;
            }
            
            showView('view-quiz');
            renderQuestion();
        }

        function abortQuiz() {
            if(confirm("Möchtest du das Quiz wirklich abbrechen? Dein Fortschritt wird nicht gespeichert.")) {
                showStartMenu();
            }
        }

        function renderQuestion() {
            hasChecked = false;
            const q = currentSet[currentIndex];
            
            document.getElementById('quiz-progress-text').innerText = `Frage ${currentIndex + 1} von ${currentSet.length}`;
            const percent = ((currentIndex) / currentSet.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = percent + '%';
            
            document.getElementById('question-text').innerHTML = `<b>${q.id}.</b> ${q.text}`;
            
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                optDiv.id = 'opt-' + idx;
                optDiv.onclick = () => toggleOption(idx);
                
                const icon = document.createElement('span');
                icon.className = 'option-icon';
                icon.innerText = 'check_box_outline_blank';
                icon.id = 'icon-' + idx;
                
                const textSpan = document.createElement('span');
                textSpan.innerText = opt.text;
                
                optDiv.appendChild(icon);
                optDiv.appendChild(textSpan);
                optsContainer.appendChild(optDiv);
            });
            
            document.getElementById('btn-check').style.display = 'inline-flex';
            document.getElementById('btn-next').style.display = 'none';
            const feedback = document.getElementById('feedback-msg');
            feedback.className = 'feedback';
            feedback.innerText = '';
        }

        function toggleOption(idx) {
            if (hasChecked) return;
            const optDiv = document.getElementById('opt-' + idx);
            const icon = document.getElementById('icon-' + idx);
            
            if (optDiv.classList.contains('selected')) {
                optDiv.classList.remove('selected');
                icon.innerText = 'check_box_outline_blank';
            } else {
                optDiv.classList.add('selected');
                icon.innerText = 'check_box';
            }
        }

        function checkAnswer() {
            if (hasChecked) return;
            hasChecked = true;
            
            const q = currentSet[currentIndex];
            let isPerfect = true;
            
            q.options.forEach((opt, idx) => {
                const optDiv = document.getElementById('opt-' + idx);
                const icon = document.getElementById('icon-' + idx);
                const isSelected = optDiv.classList.contains('selected');
                
                optDiv.classList.add('disabled');
                optDiv.classList.remove('selected'); 
                
                // Behalte das Häkchen genau so, wie der Nutzer es gesetzt hat
                if (isSelected) {
                    icon.innerText = 'check_box';
                } else {
                    icon.innerText = 'check_box_outline_blank';
                }
                
                if (opt.isCorrect) {
                    // Mache den Block grün, weil die Antwort korrekt war
                    optDiv.classList.add('correct');
                    if (!isSelected) isPerfect = false; 
                } else {
                    if (isSelected) {
                        // Mache den Block rot, weil die Antwort falsch war, aber ausgewählt wurde
                        optDiv.classList.add('incorrect');
                        isPerfect = false;
                    }
                }
            });
            
            const feedback = document.getElementById('feedback-msg');
            if (isPerfect) {
                score++;
                stats.correct++;
                feedback.innerText = "Perfekt!";
                feedback.className = 'feedback success';
            } else {
                incorrectQuestions.push(q);
                stats.wrong++;
                feedback.innerText = "Leider nicht ganz richtig.";
                feedback.className = 'feedback error';
            }
            
            const percent = ((currentIndex + 1) / currentSet.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = percent + '%';
            
            document.getElementById('btn-check').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-flex';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentSet.length) {
                renderQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            stats.tests++;
            saveStats();
            
            document.getElementById('result-circle').innerText = `${score}/${currentSet.length}`;
            document.getElementById('result-text').innerText = `Du hast ${score} von ${currentSet.length} Fragen richtig beantwortet.`;
            
            const retryBtn = document.getElementById('btn-retry');
            if (incorrectQuestions.length > 0) {
                retryBtn.style.display = 'inline-flex';
                retryBtn.innerText = `Die ${incorrectQuestions.length} falschen Fragen wiederholen`;
            } else {
                retryBtn.style.display = 'none';
            }
            
            showView('view-end');
        }

        updateStatsUI();
    </script>
</body>
</html>
